apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prod

resources:
  - ../../base

images:
  - name: gitops-demo-backend
    newName: superkittychen/gitops-demo-backend
    newTag: v1.0.0

replicas:
  - name: backend
    count: 3

patches:
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: ENV
          value: prod
    target:
      kind: Deployment
      name: backend
