apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dev

resources:
  - ../../base
  - frontend-public-service.yaml

images:
  - name: gitops-demo-frontend
    newName: superkittychen/gitops-demo-frontend
    newTag: dev

replicas:
  - name: frontend
    count: 1

patches:
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: ENV
          value: dev
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
    target:
      kind: Deployment
      name: frontend
