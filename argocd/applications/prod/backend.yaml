apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend-prod
  namespace: argocd
  labels:
    app: backend
    env: prod
spec:
  project: default

  source:
    repoURL: https://github.com/KittyChen913/gitops-demo-apps.git
    targetRevision: master
    path: apps/backend/overlays/prod

  destination:
    server: https://kubernetes.default.svc
    namespace: prod

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
