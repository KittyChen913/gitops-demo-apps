apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend-dev
  namespace: argocd
  labels:
    app: frontend
    env: dev
spec:
  project: default

  source:
    repoURL: https://github.com/KittyChen913/gitops-demo-apps.git
    targetRevision: master
    path: apps/frontend/overlays/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
