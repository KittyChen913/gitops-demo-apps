apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gitops-demo-dev
  namespace: argocd
spec:
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - app: backend
                - app: frontend
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
  template:
    metadata:
      name: "{{app}}-dev"
      labels:
        app: "{{app}}"
        env: dev
    spec:
      project: default

      source:
        repoURL: https://github.com/KittyChen913/gitops-demo-apps.git
        targetRevision: master
        path: "apps/{{app}}/overlays/dev"

      destination:
        server: '{{server}}'
        namespace: dev

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
