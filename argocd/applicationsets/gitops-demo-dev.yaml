apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gitops-demo-dev
  namespace: argocd
spec:
  # Progressive Syncs：Dev 的發布順序固定為 backend -> frontend。
  # 需要 ArgoCD ApplicationSet controller 已啟用 progressive syncs
  # （由 gitops-demo-argocd 的 argocd/install 提供），否則本 strategy 不會生效。
  strategy:
    type: RollingSync
    rollingSync:
      steps:
        # Step 1：backend 必須先進入 Synced/Healthy
        - matchExpressions:
            - key: app
              operator: In
              values:
                - backend
        # Step 2：確認 backend 健康後才同步 frontend
        - matchExpressions:
            - key: app
              operator: In
              values:
                - frontend

  generators:
    - matrix:
        generators:
          - list:
              elements:
                - app: backend
                - app: frontend
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
  template:
    metadata:
      name: "{{app}}-dev"
      labels:
        app: "{{app}}"
        env: dev
    spec:
      project: default

      source:
        repoURL: https://github.com/KittyChen913/gitops-demo-apps.git
        targetRevision: master
        path: "apps/{{app}}/overlays/dev"

      destination:
        server: '{{server}}'
        namespace: dev

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
